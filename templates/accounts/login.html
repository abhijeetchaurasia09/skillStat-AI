{% extends 'base.html' %}

{% block title %}Sign In — SkillStat AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
                            <i class="bi bi-diagram-3-fill fs-2"></i>
                        </div>
                        <h2 class="h3 fw-bold mb-1">Sign in to SkillStat AI</h2>
                        <p class="text-muted small">MoSPI / iGOT Karmayogi Competency Hub</p>
                    </div>

                    <!-- Demo credentials callout -->
                    <div class="alert alert-info py-2 px-3 small rounded-3 d-flex align-items-center justify-content-between mb-4">
                        <div>
                            <i class="bi bi-info-circle-fill me-1"></i>
                            <strong>Quick Demo Login:</strong>
                            <div class="mt-1">Username: <code>demo</code> | Password: <code>demo123</code></div>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-info" onclick="fillDemoCredentials()">Fill</button>
                    </div>

                    <form method="post" action="{% url 'accounts:login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label small fw-semibold">Username</label>
                            <input type="text" name="username" id="id_username" class="form-control" required autofocus placeholder="Enter your username">
                        </div>

                        <div class="mb-3">
                            <label for="id_password" class="form-label small fw-semibold">Password</label>
                            <input type="password" name="password" id="id_password" class="form-control" required placeholder="••••••••">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2.5 mt-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="fw-semibold text-primary">Register new profile</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemoCredentials() {
    document.getElementById('id_username').value = 'demo';
    document.getElementById('id_password').value = 'demo123';
}
</script>
{% endblock %}
